# ClickHouse on Dokploy -- single node, no public ports.
#
# Image tag 26.3-alpine tracks PATCH releases inside the 26.3 line and never
# crosses a minor boundary, so a redeploy cannot trigger the irreversible
# upgrade that :latest can (ClickHouse cannot downgrade once parts are written
# in a newer format). For a frozen pin use 26.3.30.9-alpine.
#
# All server config is inline below via `configs:` rather than Dokploy File
# Mounts -- one artifact, nothing to keep in sync, and no bind-mount source
# that Docker silently turns into an empty directory when it is missing.
# Requires Compose >= 2.23 for `configs.content`; check `docker compose version`.
#
# Required in Dokploy > Environment:  CH_USER, CH_PASSWORD,
#                                     OTLP_AUTH_TOKEN, CH_INGEST_PASSWORD

services:
  clickhouse:
    image: clickhouse/clickhouse-server:26.3-alpine
    restart: unless-stopped
    environment:
      CLICKHOUSE_DB: playground
      CLICKHOUSE_USER: ${CH_USER}
      CLICKHOUSE_PASSWORD: ${CH_PASSWORD}
      # Aliased to CLICKHOUSE_ACCESS_MANAGEMENT inside the entrypoint.
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    volumes:
      - clickhouse-data:/var/lib/clickhouse
      - clickhouse-logs:/var/log/clickhouse-server
    configs:
      # NOTE: users.d receives a single FILE, never a read-only directory --
      # the entrypoint writes users.d/default-user.xml on every boot to create
      # CLICKHOUSE_USER. A read-only users.d mount is a guaranteed crash loop.
      - source: ch_memory
        target: /etc/clickhouse-server/config.d/10-memory.xml
      - source: ch_logttl
        target: /etc/clickhouse-server/config.d/20-system-log-ttl.xml
      - source: ch_limits
        target: /etc/clickhouse-server/users.d/99-limits.xml
    deploy:
      resources:
        limits:
          memory: 4G          # keep ch_memory below in step with this
    # NO `ports:` BLOCK. Deliberate -- see the labels below.
    #
    # A published port here would be plaintext HTTP on a public IP, bypassing
    # Traefik and the certificate entirely. Docker inserts its own rules ahead
    # of ufw's chain, so publishing a port IS exposing it and no firewall rule
    # takes it back. Traefik reaches 8123 over dokploy-network instead, which
    # needs no host port at all.
    networks:
      - dokploy-network
    labels:
      - traefik.enable=true
      - traefik.docker.network=dokploy-network
      # sslip.io resolves <ip>.sslip.io -> <ip> with no DNS setup and no domain
      # purchase, and Let's Encrypt will issue for it -- which a bare IP can
      # never get. Verified 2026-09-05: 62.169.19.91.sslip.io -> 62.169.19.91.
      - traefik.http.routers.clickhouse.rule=Host(`62.169.19.91.sslip.io`)
      - traefik.http.routers.clickhouse.entrypoints=websecure
      - traefik.http.routers.clickhouse.tls.certresolver=letsencrypt
      - traefik.http.services.clickhouse.loadbalancer.server.port=8123

  # ---------------------------------------------------------------------------
  # Session replay + browser telemetry ingest.
  #
  # This is the ClickStack distribution of the OTel collector, NOT the upstream
  # contrib image. The difference is the whole reason Client Sessions works: it
  # ships the `routing/logs` connector that matches `attributes["rr-web.event"]`
  # and diverts those log records to a second ClickHouse exporter writing
  # `otel.hyperdx_sessions`. A plain contrib collector with a ClickHouse
  # exporter gives you logs and traces and an EMPTY Sessions tab.
  #
  # It creates the whole `otel.*` schema itself on first write -- there is no
  # schema file to apply here, unlike aroundtrail.*.
  #
  # Required in Dokploy > Environment (in addition to CH_USER / CH_PASSWORD):
  #   OTLP_AUTH_TOKEN       bearer token browsers send. NOT A SECRET -- it ships
  #                         in the client bundle. It is a spam gate, nothing more.
  #   CH_INGEST_PASSWORD    password for the hyperdx_ingest SQL user (see
  #                         create-ingest-user.sql -- run that FIRST).
  otel-collector:
    image: clickhouse/clickstack-otel-collector:latest
    restart: unless-stopped
    depends_on:
      - clickhouse
    environment:
      # Plain HTTP over dokploy-network to the container next door: this hop
      # never leaves the host, so terminating TLS on it would mean the
      # collector chasing the Let's Encrypt cert for a name that resolves to
      # the public IP -- a hairpin through Traefik for no gain.
      #
      # `clickhouse` is the compose SERVICE name, which Compose registers as a
      # network alias on dokploy-network. That network is shared with every
      # other Dokploy app on this box, so if anything else ever defines a
      # service called `clickhouse`, this resolves to a coin flip. Rename both
      # sides if that happens.
      CLICKHOUSE_ENDPOINT: http://clickhouse:8123
      CLICKHOUSE_USER: hyperdx_ingest
      CLICKHOUSE_PASSWORD: ${CH_INGEST_PASSWORD}
      HYPERDX_OTEL_EXPORTER_CLICKHOUSE_DATABASE: otel
      OTLP_AUTH_TOKEN: ${OTLP_AUTH_TOKEN}
    deploy:
      resources:
        limits:
          memory: 1G          # the image's memory_limiter is set at 1500 MiB
    # NO `ports:` BLOCK, for the same reason ClickHouse has none. 4317 (gRPC)
    # stays unreachable from outside entirely -- browsers speak OTLP/HTTP, and
    # nothing else sends to this collector yet.
    networks:
      - dokploy-network
    labels:
      - traefik.enable=true
      - traefik.docker.network=dokploy-network
      # A DIFFERENT sslip.io name from ClickHouse's, not a PathPrefix on the
      # same one: ClickHouse's HTTP interface answers on every path, so a
      # prefix router here would sit one Traefik priority rule away from
      # silently swallowing browser telemetry into a SQL parser.
      #
      # sslip.io resolves any label prefix, so otel.<ip>.sslip.io -> <ip> with
      # no DNS record to create; Let's Encrypt issues for it separately.
      - traefik.http.routers.otelcol.rule=Host(`otel.62.169.19.91.sslip.io`)
      - traefik.http.routers.otelcol.entrypoints=websecure
      - traefik.http.routers.otelcol.tls.certresolver=letsencrypt
      - traefik.http.services.otelcol.loadbalancer.server.port=4318

configs:
  ch_memory:
    content: |
      <clickhouse>
          <!-- Older CH sizes itself from HOST ram rather than the cgroup limit;
               this is what actually stops it OOM-killing the rest of the box.
               Keep max_server_memory_usage at ~75-80% of deploy.limits.memory. -->
          <max_server_memory_usage_to_ram_ratio>0.7</max_server_memory_usage_to_ram_ratio>
          <max_server_memory_usage>3221225472</max_server_memory_usage>
          <mark_cache_size>536870912</mark_cache_size>
      </clickhouse>

  ch_logttl:
    content: |
      <clickhouse>
          <!-- An idle instance left running for months dies of system-log
               growth. This instance's likely future, so cap it now. -->
          <query_log><ttl>event_date + INTERVAL 30 DAY DELETE</ttl></query_log>
          <trace_log><ttl>event_date + INTERVAL 30 DAY DELETE</ttl></trace_log>
          <part_log><ttl>event_date + INTERVAL 30 DAY DELETE</ttl></part_log>
          <metric_log><ttl>event_date + INTERVAL 14 DAY DELETE</ttl></metric_log>
          <asynchronous_metric_log><ttl>event_date + INTERVAL 14 DAY DELETE</ttl></asynchronous_metric_log>
      </clickhouse>

  ch_limits:
    content: |
      <clickhouse>
          <!-- The entrypoint's default-user.xml REMOVES the `default` user and
               creates CLICKHOUSE_USER, so no <default> user block is needed
               here. 99- sorts after it regardless. -->
          <profiles>
              <default>
                  <max_memory_usage>2000000000</max_memory_usage>
                  <max_execution_time>60</max_execution_time>
              </default>
          </profiles>
      </clickhouse>

volumes:
  clickhouse-data:
  clickhouse-logs:

networks:
  dokploy-network:
    external: true
